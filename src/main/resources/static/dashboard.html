<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard — Sistema de Frotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { background: #f5f5f5; }
        .sidebar { width: 240px; min-height: 100vh; background: #1b5e20; position: fixed; top:0; left:0; z-index:100; }
        .sidebar .nav-link { color: rgba(255,255,255,0.8); padding: 10px 20px; border-radius: 8px; margin: 2px 8px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.15); color: #fff; }
        .sidebar .nav-link i { width: 20px; }
        .main { margin-left: 240px; padding: 24px; }
        .card-stat { border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        #mapa { height: 380px; width: 100%; border-radius: 8px; }
        .topbar { background: #fff; border-radius: 12px; padding: 12px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
        .card-viagem { border-radius: 10px; border: 1px solid #e0e0e0; padding: 12px; margin-bottom: 10px; background: #fff; transition: box-shadow 0.2s; }
        .card-viagem:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
        .relogio-box { background: #1b5e20; color: white; border-radius: 12px; padding: 8px 16px; text-align: center; min-width: 200px; }
        .relogio-hora { font-size: 1.7rem; font-weight: bold; letter-spacing: 3px; font-family: 'Courier New', monospace; }
        .relogio-data { font-size: 0.75rem; opacity: 0.85; margin-top: 2px; }
    </style>
</head>
<body>

<div class="sidebar d-flex flex-column py-3">
    <div class="text-center text-white mb-4 mt-2">
        <i class="bi bi-truck fs-2"></i>
        <div class="fw-bold mt-1">Frotas</div>
    </div>
    <nav class="nav flex-column">
        <a href="/dashboard.html" class="nav-link active"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
        <a href="/veiculos.html" class="nav-link"><i class="bi bi-truck me-2"></i>Veículos</a>
        <a href="/motoristas.html" class="nav-link"><i class="bi bi-person-badge me-2"></i>Motoristas</a>
        <a href="/rotas.html" class="nav-link"><i class="bi bi-map me-2"></i>Rotas</a>
        <a href="/viagens.html" class="nav-link"><i class="bi bi-signpost-split me-2"></i>Viagens</a>
    </nav>
    <div class="mt-auto px-3">
        <button onclick="logout()" class="btn btn-outline-light btn-sm w-100">
            <i class="bi bi-box-arrow-left me-1"></i>Sair
        </button>
    </div>
</div>

<div class="main">
    <div class="topbar">
        <div>
            <h5 class="mb-0 fw-bold text-success"><i class="bi bi-speedometer2 me-2"></i>Dashboard</h5>
            <div class="text-muted small" id="nomeUsuario"></div>
        </div>
        <div class="relogio-box">
            <div class="relogio-hora" id="relogioHora">00:00:00</div>
            <div class="relogio-data" id="relogioData"></div>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card card-stat p-3 border-start border-success border-4">
                <div class="text-muted small">Veículos</div>
                <div class="fs-2 fw-bold text-success" id="totalVeiculos"><span class="spinner-border spinner-border-sm"></span></div>
                <div class="text-muted small">cadastrados</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-stat p-3 border-start border-primary border-4">
                <div class="text-muted small">Motoristas</div>
                <div class="fs-2 fw-bold text-primary" id="totalMotoristas"><span class="spinner-border spinner-border-sm"></span></div>
                <div class="text-muted small">cadastrados</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-stat p-3 border-start border-warning border-4">
                <div class="text-muted small">Viagens Ativas</div>
                <div class="fs-2 fw-bold text-warning" id="totalAtivas"><span class="spinner-border spinner-border-sm"></span></div>
                <div class="text-muted small">em andamento</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-stat p-3 border-start border-info border-4">
                <div class="text-muted small">Rotas</div>
                <div class="fs-2 fw-bold text-info" id="totalRotas"><span class="spinner-border spinner-border-sm"></span></div>
                <div class="text-muted small">cadastradas</div>
            </div>
        </div>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-7">
            <div class="card p-3" style="border-radius:12px;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.08)">
                <h6 class="fw-bold mb-3"><i class="bi bi-map me-2 text-success"></i>Mapa de Rotas</h6>
                <div id="mapa"></div>
                <div class="mt-2 d-flex gap-2">
                    <button class="btn btn-sm btn-outline-success" onclick="usarLeaflet()"><i class="bi bi-map me-1"></i>Leaflet</button>
                    <button class="btn btn-sm btn-outline-primary" onclick="usarCarto()"><i class="bi bi-globe me-1"></i>CARTO</button>
                </div>
            </div>
        </div>
        <div class="col-md-5">
            <div class="card p-3" style="border-radius:12px;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.08);height:100%">
                <h6 class="fw-bold mb-3"><i class="bi bi-signpost-split me-2 text-warning"></i>Viagens Ativas</h6>
                <div id="listaViagensAtivas" style="max-height:400px;overflow-y:auto">
                    <div class="text-center py-3">
                        <span class="spinner-border text-warning"></span>
                        <div class="text-muted small mt-2">Carregando viagens...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card p-3" style="border-radius:12px;border:none;box-shadow:0 2px 8px rgba(0,0,0,0.08)">
        <h6 class="fw-bold mb-3"><i class="bi bi-file-earmark-text me-2 text-danger"></i>Relatórios</h6>
        <div class="d-flex gap-2 flex-wrap">
            <button onclick="baixarRelatorio('/api/relatorios/viagens/pdf','relatorio-viagens.pdf')" class="btn btn-outline-danger btn-sm"><i class="bi bi-file-pdf me-1"></i>Viagens PDF</button>
            <button onclick="baixarRelatorio('/api/relatorios/veiculos/pdf','relatorio-veiculos.pdf')" class="btn btn-outline-danger btn-sm"><i class="bi bi-file-pdf me-1"></i>Veículos PDF</button>
            <button onclick="baixarRelatorio('/api/relatorios/motoristas/pdf','relatorio-motoristas.pdf')" class="btn btn-outline-danger btn-sm"><i class="bi bi-file-pdf me-1"></i>Motoristas PDF</button>
            <button onclick="baixarRelatorio('/api/relatorios/viagens/excel','relatorio-viagens.xlsx')" class="btn btn-outline-success btn-sm"><i class="bi bi-file-excel me-1"></i>Viagens Excel</button>
            <button onclick="baixarRelatorio('/api/relatorios/veiculos/excel','relatorio-veiculos.xlsx')" class="btn btn-outline-success btn-sm"><i class="bi bi-file-excel me-1"></i>Veículos Excel</button>
            <button onclick="baixarRelatorio('/api/relatorios/motoristas/excel','relatorio-motoristas.xlsx')" class="btn btn-outline-success btn-sm"><i class="bi bi-file-excel me-1"></i>Motoristas Excel</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/api.js"></script>
<script>
    checkAuth();
    document.getElementById('nomeUsuario').textContent = 'Olá, ' + (getUsuario().nome || 'Usuário');

    // RELÓGIO
    const diasSemana = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
    const mesesNome = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    function atualizarRelogio() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2,'0');
        const m = String(now.getMinutes()).padStart(2,'0');
        const s = String(now.getSeconds()).padStart(2,'0');
        document.getElementById('relogioHora').textContent = h+':'+m+':'+s;
        document.getElementById('relogioData').textContent =
            diasSemana[now.getDay()] + ', ' + now.getDate() + ' de ' + mesesNome[now.getMonth()] + ' de ' + now.getFullYear();
    }
    atualizarRelogio();
    setInterval(atualizarRelogio, 1000);

    // MAPA
    let mapa = null;
    let tileAtual = null;
    window.addEventListener('load', function() {
        setTimeout(() => {
            mapa = L.map('mapa').setView([-15.7801, -47.9292], 4);
            tileAtual = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                { attribution: '© OpenStreetMap | Leaflet' }).addTo(mapa);
            mapa.invalidateSize();
            carregarViagensAtivas();
        }, 300);
    });

    function usarLeaflet() {
        if (!mapa) return;
        if (tileAtual) mapa.removeLayer(tileAtual);
        tileAtual = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            { attribution: '© OpenStreetMap | Leaflet' }).addTo(mapa);
    }
    function usarCarto() {
        if (!mapa) return;
        if (tileAtual) mapa.removeLayer(tileAtual);
        tileAtual = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
            { attribution: '© CARTO | © OpenStreetMap' }).addTo(mapa);
    }

    // DOWNLOAD COM AUTH
    async function baixarRelatorio(path, nomeArquivo) {
        try {
            const res = await fetch('http://localhost:8080' + path, {
                headers: { 'Authorization': 'Bearer ' + getToken() }
            });
            if (!res.ok) throw new Error('Erro ao gerar relatório (status ' + res.status + ')');
            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nomeArquivo;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);
        } catch (e) {
            alert('Erro ao baixar: ' + e.message);
        }
    }

    // STATS
    async function carregarStats() {
        try {
            const opts = { headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() } };
            const [v, m, r, va] = await Promise.all([
                fetch('http://localhost:8080/api/veiculos?size=1', opts).then(r => r.json()),
                fetch('http://localhost:8080/api/motoristas?size=1', opts).then(r => r.json()),
                fetch('http://localhost:8080/api/rotas?size=1', opts).then(r => r.json()),
                fetch('http://localhost:8080/api/viagens/ativas?size=1', opts).then(r => r.json())
            ]);
            document.getElementById('totalVeiculos').textContent = v.totalElements ?? '0';
            document.getElementById('totalMotoristas').textContent = m.totalElements ?? '0';
            document.getElementById('totalRotas').textContent = r.totalElements ?? '0';
            document.getElementById('totalAtivas').textContent = va.totalElements ?? '0';
        } catch (e) {
            ['totalVeiculos','totalMotoristas','totalRotas','totalAtivas'].forEach(id => document.getElementById(id).textContent = '—');
        }
    }

    // MARCADORES COM ROTA REAL
    async function adicionarMarcadoresViagem(v) {
        if (!mapa) return;
        const iconA = L.divIcon({ html: `<div style="background:#2e7d32;color:white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,0.4);border:2px solid white">A</div>`, iconSize:[30,30], iconAnchor:[15,15] });
        const iconB = L.divIcon({ html: `<div style="background:#c62828;color:white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,0.4);border:2px solid white">B</div>`, iconSize:[30,30], iconAnchor:[15,15] });
        const iconT = L.divIcon({ html: `<div style="background:#e65100;color:white;border-radius:8px;padding:3px 7px;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,0.4)">🚛</div>`, iconSize:[38,30], iconAnchor:[19,15] });

        try {
            const geometria = await apiFetch(
                `/rotas/gps/geometria?origem=${encodeURIComponent(v.rota.origem)}&destino=${encodeURIComponent(v.rota.destino)}`
            );
            if (geometria && geometria.length > 1) {
                const primeiro = geometria[0];
                const ultimo = geometria[geometria.length - 1];
                const meio = geometria[Math.floor(geometria.length / 2)];

                L.marker(primeiro, {icon: iconA}).addTo(mapa).bindPopup(`<b>📍 Origem</b><br>${v.rota.origem}`);
                L.marker(ultimo, {icon: iconB}).addTo(mapa).bindPopup(`<b>🏁 Destino</b><br>${v.rota.destino}`);
                L.marker(meio, {icon: iconT}).addTo(mapa).bindPopup(`<b>🚛 ${v.veiculo.placa}</b><br>👤 ${v.motorista.nome}<br>📍 ${v.rota.origem} → ${v.rota.destino}<br>💰 R$ ${v.custoCalculado?.toFixed(2)||'—'}`);

                const rotaLayer = L.polyline(geometria, { color:'#1565c0', weight:4, opacity:0.85 }).addTo(mapa);
                mapa.fitBounds(rotaLayer.getBounds(), { padding:[40,40] });
            } else {
                throw new Error('Geometria vazia');
            }
        } catch(err) {
            console.warn('Rota real falhou, usando fallback:', err.message);
            try {
                const [cO, cD] = await Promise.all([geocodificarCidade(v.rota.origem), geocodificarCidade(v.rota.destino)]);
                if (cO && cD) {
                    L.marker([cO.lat, cO.lon], {icon: iconA}).addTo(mapa).bindPopup(`<b>📍 Origem</b><br>${v.rota.origem}`);
                    L.marker([cD.lat, cD.lon], {icon: iconB}).addTo(mapa).bindPopup(`<b>🏁 Destino</b><br>${v.rota.destino}`);
                    L.marker([(cO.lat+cD.lat)/2,(cO.lon+cD.lon)/2], {icon: iconT}).addTo(mapa).bindPopup(`<b>🚛 ${v.veiculo.placa}</b>`);
                    L.polyline([[cO.lat,cO.lon],[cD.lat,cD.lon]], {color:'#1565c0',weight:3,dashArray:'8,6',opacity:0.8}).addTo(mapa);
                    mapa.fitBounds([[cO.lat,cO.lon],[cD.lat,cD.lon]], {padding:[60,60]});
                }
            } catch(e2) { console.error('Fallback falhou:', e2); }
        }
    }

    async function geocodificarCidade(cidade) {
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(cidade)},Brasil&format=json&limit=1`, { headers:{'User-Agent':'GerenciamentoFrotas/1.0'} });
            const data = await res.json();
            if (data && data.length > 0) return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
        } catch(e) {}
        return null;
    }

    // VIAGENS ATIVAS
    async function carregarViagensAtivas() {
        try {
            const data = await apiFetch('/viagens/ativas?size=10');
            const el = document.getElementById('listaViagensAtivas');
            if (!data.content || data.content.length === 0) {
                el.innerHTML = `<div class="text-center text-muted py-4"><i class="bi bi-inbox fs-2 d-block mb-2"></i>Nenhuma viagem ativa no momento</div>`;
                return;
            }
            el.innerHTML = data.content.map(v => `
                <div class="card-viagem">
                    <span class="badge bg-warning text-dark mb-2">Em andamento</span>
                    <div class="fw-semibold"><i class="bi bi-truck me-1 text-success"></i>${v.veiculo.placa} — ${v.veiculo.tipo}</div>
                    <div class="text-muted small mt-1"><i class="bi bi-person me-1"></i>${v.motorista.nome}</div>
                    <div class="text-muted small"><i class="bi bi-geo-alt me-1 text-success"></i>${v.rota.origem} <i class="bi bi-arrow-right mx-1"></i><i class="bi bi-geo-alt-fill me-1 text-danger"></i>${v.rota.destino}</div>
                    <div class="text-muted small"><i class="bi bi-cash me-1"></i>Custo: <strong>R$ ${v.custoCalculado?.toFixed(2)||'—'}</strong></div>
                    <button class="btn btn-sm btn-warning w-100 mt-2 fw-semibold" onclick="finalizarViagem(${v.id})"><i class="bi bi-flag-fill me-1"></i>Finalizar Viagem</button>
                </div>
            `).join('');
            for (const v of data.content) await adicionarMarcadoresViagem(v);
        } catch(e) {
            document.getElementById('listaViagensAtivas').innerHTML = `<div class="alert alert-danger small"><i class="bi bi-exclamation-triangle me-1"></i>Erro: ${e.message}</div>`;
        }
    }

    async function finalizarViagem(id) {
        if (!confirm(`Finalizar viagem #${id}?\n\nVeículo e motorista serão liberados.`)) return;
        try {
            await apiFetch('/viagens/'+id+'/finalizar', {method:'PATCH'});
            if (mapa) {
                mapa.eachLayer(l => { if (l instanceof L.Marker || l instanceof L.Polyline) mapa.removeLayer(l); });
                mapa.setView([-15.7801, -47.9292], 4);
            }
            await carregarStats();
            await carregarViagensAtivas();
        } catch(e) { alert('Erro ao finalizar: '+e.message); }
    }

    carregarStats();
</script>
</body>
</html>
