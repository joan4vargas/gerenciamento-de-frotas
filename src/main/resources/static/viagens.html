<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Viagens — Sistema de Frotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; }
        .sidebar { width: 240px; min-height: 100vh; background: #1b5e20; position: fixed; top:0; left:0; }
        .sidebar .nav-link { color: rgba(255,255,255,0.8); padding: 10px 20px; border-radius: 8px; margin: 2px 8px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.15); color: #fff; }
        .main { margin-left: 240px; padding: 24px; }
        .topbar { background: #fff; border-radius: 12px; padding: 12px 20px;
                  box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 24px;
                  display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
<div class="sidebar d-flex flex-column py-3">
    <div class="text-center text-white mb-4 mt-2">
        <i class="bi bi-truck fs-2"></i>
        <div class="fw-bold mt-1">Frotas</div>
    </div>
    <nav class="nav flex-column">
        <a href="/dashboard.html" class="nav-link"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
        <a href="/veiculos.html" class="nav-link"><i class="bi bi-truck me-2"></i>Veículos</a>
        <a href="/motoristas.html" class="nav-link"><i class="bi bi-person-badge me-2"></i>Motoristas</a>
        <a href="/rotas.html" class="nav-link"><i class="bi bi-map me-2"></i>Rotas</a>
        <a href="/viagens.html" class="nav-link active"><i class="bi bi-signpost-split me-2"></i>Viagens</a>
    </nav>
    <div class="mt-auto px-3">
        <button onclick="logout()" class="btn btn-outline-light btn-sm w-100">
            <i class="bi bi-box-arrow-left me-1"></i>Sair
        </button>
    </div>
</div>

<div class="main">
    <div class="topbar">
        <h5 class="mb-0 fw-bold text-success"><i class="bi bi-signpost-split me-2"></i>Viagens</h5>
        <button class="btn btn-success btn-sm" onclick="abrirModal()">
            <i class="bi bi-plus-lg me-1"></i>Nova Viagem
        </button>
    </div>

    <!-- Filtros -->
    <div class="mb-3 d-flex gap-2">
        <button class="btn btn-outline-secondary btn-sm active" id="btnTodas"
                onclick="filtrar('todas')">Todas</button>
        <button class="btn btn-outline-warning btn-sm" id="btnAtivas"
                onclick="filtrar('ativas')">Em Andamento</button>
        <button class="btn btn-outline-success btn-sm" id="btnFinalizadas"
                onclick="filtrar('finalizadas')">Finalizadas</button>
    </div>

    <div class="card p-3" style="border-radius:12px; border:none; box-shadow:0 2px 8px rgba(0,0,0,0.08)">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-success">
                <tr>
                    <th>ID</th><th>Veículo</th><th>Motorista</th><th>Rota</th>
                    <th>Partida</th><th>Peso (kg)</th><th>Custo</th><th>Status</th><th>Ações</th>
                </tr>
                </thead>
                <tbody id="tabela"></tbody>
            </table>
        </div>
        <div id="paginacao" class="d-flex justify-content-center gap-2 mt-2"></div>
    </div>
</div>

<!-- Modal Nova Viagem -->
<div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">Nova Viagem</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Veículo</label>
                        <select id="veiculoId" class="form-select">
                            <option value="">Carregando...</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Motorista</label>
                        <select id="motoristaId" class="form-select">
                            <option value="">Carregando...</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Rota</label>
                        <select id="rotaId" class="form-select">
                            <option value="">Carregando...</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Peso da Carga (kg)</label>
                        <input type="number" id="pesoCarga" class="form-control" placeholder="Ex: 5000">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Valor do Frete (R$)</label>
                        <input type="number" id="valorCarga" class="form-control" placeholder="Ex: 10000">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Cálculo de Custo</label>
                        <select id="estrategia" class="form-select">
                            <option value="POR_DISTANCIA">Por Distância</option>
                            <option value="POR_PESO">Por Peso</option>
                        </select>
                    </div>
                </div>
                <div class="alert alert-info mt-3 small">
                    <i class="bi bi-info-circle me-1"></i>
                    Apenas veículos e motoristas com status <strong>DISPONIVEL</strong> podem ser selecionados.
                    O peso da carga não pode exceder a capacidade do veículo.
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-success" onclick="salvar()">
                    <i class="bi bi-play-fill me-1"></i>Iniciar Viagem
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
    checkAuth();
    let paginaAtual = 0;
    let filtroAtual = 'todas';
    const modal = new bootstrap.Modal(document.getElementById('modal'));

    function fmt(dt) {
        if (!dt) return '—';
        return new Date(dt).toLocaleString('pt-BR');
    }

    async function carregar(page = 0) {
        let endpoint = '/viagens';
        if (filtroAtual === 'ativas') endpoint = '/viagens/ativas';
        if (filtroAtual === 'finalizadas') endpoint = '/viagens/finalizadas';

        const data = await apiFetch(`${endpoint}?page=${page}&size=10`);
        paginaAtual = page;

        document.getElementById('tabela').innerHTML = data.content.map(v => `
            <tr>
                <td>${v.id}</td>
                <td><strong>${v.veiculo.placa}</strong><br>
                    <small class="text-muted">${v.veiculo.tipo}</small></td>
                <td>${v.motorista.nome}</td>
                <td><small>${v.rota.origem}<br>→ ${v.rota.destino}</small></td>
                <td><small>${fmt(v.dataPartida)}</small></td>
                <td>${v.pesoCarga} kg</td>
                <td>R$ ${v.custoCalculado?.toFixed(2) || '—'}</td>
                <td>
                    ${v.statusViagem
                        ? '<span class="badge bg-success">Finalizada</span>'
                        : '<span class="badge bg-warning text-dark">Em andamento</span>'}
                </td>
                <td>
                    ${!v.statusViagem ? `
                        <button class="btn btn-sm btn-warning" onclick="finalizar(${v.id})">
                            <i class="bi bi-flag-fill me-1"></i>Finalizar
                        </button>` : '—'}
                </td>
            </tr>
        `).join('');

        const pag = document.getElementById('paginacao');
        pag.innerHTML = '';
        for (let i = 0; i < data.totalPages; i++) {
            pag.innerHTML += `<button class="btn btn-sm ${i === page ? 'btn-success' : 'btn-outline-success'}"
                onclick="carregar(${i})">${i + 1}</button>`;
        }
    }

    function filtrar(tipo) {
        filtroAtual = tipo;
        document.getElementById('btnTodas').classList.toggle('active', tipo === 'todas');
        document.getElementById('btnAtivas').classList.toggle('active', tipo === 'ativas');
        document.getElementById('btnFinalizadas').classList.toggle('active', tipo === 'finalizadas');
        carregar(0);
    }

    async function abrirModal() {
        // Carregar veículos disponíveis
        const veiculos = await apiFetch('/veiculos?size=100');
        const dispVeiculos = veiculos.content.filter(v => v.status === 'DISPONIVEL');
        document.getElementById('veiculoId').innerHTML =
            '<option value="">Selecione um veículo</option>' +
            dispVeiculos.map(v =>
                `<option value="${v.id}">${v.placa} — ${v.tipo} (${v.capacidadeKg}kg)</option>`
            ).join('');

        // Carregar motoristas disponíveis
        const motoristas = await apiFetch('/motoristas?size=100');
        const dispMotoristas = motoristas.content.filter(m => m.status === 'DISPONIVEL');
        document.getElementById('motoristaId').innerHTML =
            '<option value="">Selecione um motorista</option>' +
            dispMotoristas.map(m =>
                `<option value="${m.id}">${m.nome} — CNH ${m.categoriaCnh}</option>`
            ).join('');

        // Carregar rotas
        const rotas = await apiFetch('/rotas?size=100');
        document.getElementById('rotaId').innerHTML =
            '<option value="">Selecione uma rota</option>' +
            rotas.content.map(r =>
                `<option value="${r.id}">${r.origem} → ${r.destino} (${r.distanciaKm}km)</option>`
            ).join('');

        modal.show();
    }

    async function salvar() {
    limparErros();
    let valido = true;
    const obrigatorios = [
        { id: 'veiculoId', msg: 'Selecione um veículo disponível' },
        { id: 'motoristaId', msg: 'Selecione um motorista disponível' },
        { id: 'rotaId', msg: 'Selecione uma rota' },
        { id: 'pesoCarga', msg: 'Informe o peso da carga em kg' },
        { id: 'valorCarga', msg: 'Informe o valor da carga em R$' }
    ];
    obrigatorios.forEach(({ id, msg }) => {
        const el = document.getElementById(id);
        if (!el.value || el.value.trim() === '' || el.value === '0') {
            el.classList.add('is-invalid');
            const div = document.createElement('div');
            div.className = 'invalid-feedback';
            div.textContent = msg;
            el.parentNode.appendChild(div);
            valido = false;
        }

    });
    if (!valido) return;

    const body = {
        veiculoId: parseInt(document.getElementById('veiculoId').value),
        motoristaId: parseInt(document.getElementById('motoristaId').value),
        rotaId: parseInt(document.getElementById('rotaId').value),
        dataPartida: new Date().toISOString(),
        pesoCarga: parseFloat(document.getElementById('pesoCarga').value),
        valorCarga: parseFloat(document.getElementById('valorCarga').value)
    };
    const estrategia = document.getElementById('estrategia').value;
    try {
        await apiFetch(`/viagens?estrategia=${estrategia}`, {
            method: 'POST',
            body: JSON.stringify(body)
        });
        modal.hide();
        carregar(paginaAtual);
        alert('✅ Viagem iniciada com sucesso!');
    } catch (e) {
        if (e.campos) {
            mostrarErros(e.campos);
        } else {
            alert('❌ ' + e.message);
        }
    }
}

    async function finalizar(id) {
        if (!confirm('Finalizar viagem #' + id + '? Isso liberará o veículo e motorista.')) return;
        try {
            await apiFetch('/viagens/' + id + '/finalizar', { method: 'PATCH' });
            carregar(paginaAtual);
            alert('Viagem finalizada! Veículo e motorista liberados.');
        } catch (e) { alert(e.message); }
    }

    carregar();
</script>
</body>
</html>
