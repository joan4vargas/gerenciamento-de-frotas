<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veículos — Sistema de Frotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; }
        .sidebar { width: 240px; min-height: 100vh; background: #1b5e20; position: fixed; top:0; left:0; }
        .sidebar .nav-link { color: rgba(255,255,255,0.8); padding: 10px 20px; border-radius: 8px; margin: 2px 8px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.15); color: #fff; }
        .main { margin-left: 240px; padding: 24px; }
        .topbar { background: #fff; border-radius: 12px; padding: 12px 20px;
                  box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 24px;
                  display: flex; justify-content: space-between; align-items: center; }
        .badge-DISPONIVEL { background: #2e7d32; }
        .badge-EM_VIAGEM { background: #1565c0; }
        .badge-MANUTENCAO { background: #e65100; }
        .badge-INATIVO { background: #757575; }
    </style>
</head>
<body>
<div class="sidebar d-flex flex-column py-3">
    <div class="text-center text-white mb-4 mt-2">
        <i class="bi bi-truck fs-2"></i>
        <div class="fw-bold mt-1">Frotas</div>
    </div>
    <nav class="nav flex-column">
        <a href="/dashboard.html" class="nav-link"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
        <a href="/veiculos.html" class="nav-link active"><i class="bi bi-truck me-2"></i>Veículos</a>
        <a href="/motoristas.html" class="nav-link"><i class="bi bi-person-badge me-2"></i>Motoristas</a>
        <a href="/rotas.html" class="nav-link"><i class="bi bi-map me-2"></i>Rotas</a>
        <a href="/viagens.html" class="nav-link"><i class="bi bi-signpost-split me-2"></i>Viagens</a>
    </nav>
    <div class="mt-auto px-3">
        <button onclick="logout()" class="btn btn-outline-light btn-sm w-100">
            <i class="bi bi-box-arrow-left me-1"></i>Sair
        </button>
    </div>
</div>

<div class="main">
    <div class="topbar">
        <h5 class="mb-0 fw-bold text-success"><i class="bi bi-truck me-2"></i>Veículos</h5>
        <button class="btn btn-success btn-sm" onclick="abrirModal()">
            <i class="bi bi-plus-lg me-1"></i>Novo Veículo
        </button>
    </div>

    <div class="card p-3" style="border-radius:12px; border:none; box-shadow:0 2px 8px rgba(0,0,0,0.08)">
        <div id="alerta" class="alert d-none"></div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-success">
                <tr>
                    <th>ID</th><th>Placa</th><th>Tipo</th><th>Descrição</th>
                    <th>Ano</th><th>Capacidade</th><th>Status</th><th>Ações</th>
                </tr>
                </thead>
                <tbody id="tabela"></tbody>
            </table>
        </div>
        <div id="paginacao" class="d-flex justify-content-center gap-2 mt-2"></div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="modalTitulo">Novo Veículo</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="veiculoId">
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label">Placa</label>
                        <input type="text" id="placa" class="form-control" placeholder="ABC-1234">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Tipo</label>
                        <select id="tipo" class="form-select" onchange="mostrarCampos()">
                            <option value="">Selecione</option>
                            <option value="CAMINHAO">Caminhão</option>
                            <option value="FURGAO">Furgão</option>
                            <option value="REBOQUE">Reboque</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Descrição</label>
                        <input type="text" id="descricao" class="form-control">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Chassi</label>
                        <input type="text" id="chassi" class="form-control">
                    </div>
                    <div class="col-3">
                        <label class="form-label">Ano</label>
                        <input type="number" id="ano" class="form-control" value="2020">
                    </div>
                    <div class="col-3">
                        <label class="form-label">Cap. (kg)</label>
                        <input type="number" id="capacidadeKg" class="form-control">
                    </div>
                    <!-- Campos específicos -->
                    <div id="camposMarca" class="col-6 d-none">
                        <label class="form-label">Marca</label>
                        <input type="text" id="marca" class="form-control">
                    </div>
                    <div id="camposTipoCaminhao" class="col-6 d-none">
                        <label class="form-label">Tipo Caminhão</label>
                        <input type="text" id="tipoCaminhao" class="form-control">
                    </div>
                    <div id="camposEixos" class="col-6 d-none">
                        <label class="form-label">Nº Eixos</label>
                        <input type="number" id="numeroEixos" class="form-control">
                    </div>
                    <div id="camposAssentos" class="col-6 d-none">
                        <label class="form-label">Assentos</label>
                        <input type="number" id="quantidadeAssentos" class="form-control">
                    </div>
                    <div id="camposTipoReboque" class="col-6 d-none">
                        <label class="form-label">Tipo Reboque</label>
                        <input type="text" id="tipoReboque" class="form-control">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-success" onclick="salvar()">Salvar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
    checkAuth();
    let paginaAtual = 0;
    const modal = new bootstrap.Modal(document.getElementById('modal'));

    function mostrarCampos() {
        const tipo = document.getElementById('tipo').value;
        document.getElementById('camposMarca').classList.add('d-none');
        document.getElementById('camposTipoCaminhao').classList.add('d-none');
        document.getElementById('camposEixos').classList.add('d-none');
        document.getElementById('camposAssentos').classList.add('d-none');
        document.getElementById('camposTipoReboque').classList.add('d-none');

        if (tipo === 'CAMINHAO') {
            document.getElementById('camposMarca').classList.remove('d-none');
            document.getElementById('camposTipoCaminhao').classList.remove('d-none');
            document.getElementById('camposEixos').classList.remove('d-none');
        } else if (tipo === 'FURGAO') {
            document.getElementById('camposMarca').classList.remove('d-none');
            document.getElementById('camposAssentos').classList.remove('d-none');
        } else if (tipo === 'REBOQUE') {
            document.getElementById('camposTipoReboque').classList.remove('d-none');
            document.getElementById('camposEixos').classList.remove('d-none');
        }
    }

    async function carregar(page = 0) {
        const data = await apiFetch(`/veiculos?page=${page}&size=10&sort=id`);
        paginaAtual = page;
        const tbody = document.getElementById('tabela');
        tbody.innerHTML = data.content.map(v => `
            <tr>
                <td>${v.id}</td>
                <td><strong>${v.placa}</strong></td>
                <td>${v.tipo}</td>
                <td>${v.descricao}</td>
                <td>${v.ano}</td>
                <td>${v.capacidadeKg} kg</td>
                <td><span class="badge badge-${v.status}">${v.status}</span></td>
                <td>
                    <button class="btn btn-sm btn-outline-warning me-1"
                        onclick="editarStatus(${v.id}, '${v.status}')">
                        <i class="bi bi-arrow-repeat"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger"
                        onclick="deletar(${v.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');

        // Paginação
        const pag = document.getElementById('paginacao');
        pag.innerHTML = '';
        for (let i = 0; i < data.totalPages; i++) {
            pag.innerHTML += `<button class="btn btn-sm ${i === page ? 'btn-success' : 'btn-outline-success'}"
                onclick="carregar(${i})">${i + 1}</button>`;
        }
    }

    function abrirModal(v = null) {
        document.getElementById('veiculoId').value = '';
        document.getElementById('placa').value = '';
        document.getElementById('tipo').value = '';
        document.getElementById('descricao').value = '';
        document.getElementById('chassi').value = '';
        document.getElementById('ano').value = 2020;
        document.getElementById('capacidadeKg').value = '';
        mostrarCampos();
        document.getElementById('modalTitulo').textContent = 'Novo Veículo';
        modal.show();
    }

async function salvar() {
    limparErros();
    // Validação frontend
    let valido = true;
    const obrigatorios = [
        { id: 'placa', msg: 'Informe a placa do veículo (Ex: ABC-1234)' },
        { id: 'tipo', msg: 'Selecione o tipo do veículo' },
        { id: 'descricao', msg: 'Informe uma descrição para o veículo' },
        { id: 'chassi', msg: 'Informe o número do chassi' },
        { id: 'ano', msg: 'Informe o ano de fabricação (mínimo 1990)' },
        { id: 'capacidadeKg', msg: 'Informe a capacidade máxima em kg' }
    ];
    obrigatorios.forEach(({ id, msg }) => {
        const el = document.getElementById(id);
        if (!el.value || el.value.trim() === '') {
            el.classList.add('is-invalid');
            const div = document.createElement('div');
            div.className = 'invalid-feedback';
            div.textContent = msg;
            el.parentNode.appendChild(div);
            valido = false;
        }
    });
    if (!valido) return;

    const id = document.getElementById('veiculoId').value;
    const body = {
        placa: document.getElementById('placa').value.trim().toUpperCase(),
        tipo: document.getElementById('tipo').value,
        descricao: document.getElementById('descricao').value.trim(),
        chassi: document.getElementById('chassi').value.trim().toUpperCase(),
        ano: parseInt(document.getElementById('ano').value),
        capacidadeKg: parseInt(document.getElementById('capacidadeKg').value),
        marca: document.getElementById('marca').value || null,
        tipoCaminhao: document.getElementById('tipoCaminhao').value || null,
        numeroEixos: document.getElementById('numeroEixos').value ?
            parseInt(document.getElementById('numeroEixos').value) : null,
        quantidadeAssentos: document.getElementById('quantidadeAssentos').value ?
            parseInt(document.getElementById('quantidadeAssentos').value) : null,
        tipoReboque: document.getElementById('tipoReboque').value || null
    };
    try {
        if (id) {
            await apiFetch('/veiculos/' + id, { method: 'PUT', body: JSON.stringify(body) });
        } else {
            await apiFetch('/veiculos', { method: 'POST', body: JSON.stringify(body) });
        }
        modal.hide();
        carregar(paginaAtual);
    } catch (e) {
        if (e.campos) {
            mostrarErros(e.campos);
        } else {
            mostrarAlertaErro(e.message);
        }
    }
}

    async function editarStatus(id, statusAtual) {
        const opcoes = ['DISPONIVEL', 'MANUTENCAO', 'INATIVO'];
        const novo = prompt('Status atual: ' + statusAtual +
            '\nNovo status (DISPONIVEL, MANUTENCAO, INATIVO):', statusAtual);
        if (!novo) return;
        try {
            await apiFetch(`/veiculos/${id}/status?status=${novo}`, { method: 'PATCH' });
            carregar(paginaAtual);
        } catch (e) { alert(e.message); }
    }

    async function deletar(id) {
        if (!confirm('Excluir veículo #' + id + '?')) return;
        try {
            await apiFetch('/veiculos/' + id, { method: 'DELETE' });
            carregar(paginaAtual);
        } catch (e) { alert(e.message); }
    }

    carregar();
</script>
</body>
</html>
