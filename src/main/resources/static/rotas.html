<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rotas — Sistema de Frotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { background: #f5f5f5; }
        .sidebar { width: 240px; min-height: 100vh; background: #1b5e20; position: fixed; top:0; left:0; }
        .sidebar .nav-link { color: rgba(255,255,255,0.8); padding: 10px 20px; border-radius: 8px; margin: 2px 8px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.15); color: #fff; }
        .main { margin-left: 240px; padding: 24px; }
        .topbar { background: #fff; border-radius: 12px; padding: 12px 20px;
                  box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 24px;
                  display: flex; justify-content: space-between; align-items: center; }
        #mapaRota { height: 300px; border-radius: 8px; }
    </style>
</head>
<body>
<div class="sidebar d-flex flex-column py-3">
    <div class="text-center text-white mb-4 mt-2">
        <i class="bi bi-truck fs-2"></i>
        <div class="fw-bold mt-1">Frotas</div>
    </div>
    <nav class="nav flex-column">
        <a href="/dashboard.html" class="nav-link"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
        <a href="/veiculos.html" class="nav-link"><i class="bi bi-truck me-2"></i>Veículos</a>
        <a href="/motoristas.html" class="nav-link"><i class="bi bi-person-badge me-2"></i>Motoristas</a>
        <a href="/rotas.html" class="nav-link active"><i class="bi bi-map me-2"></i>Rotas</a>
        <a href="/viagens.html" class="nav-link"><i class="bi bi-signpost-split me-2"></i>Viagens</a>
    </nav>
    <div class="mt-auto px-3">
        <button onclick="logout()" class="btn btn-outline-light btn-sm w-100">
            <i class="bi bi-box-arrow-left me-1"></i>Sair
        </button>
    </div>
</div>

<div class="main">
    <div class="topbar">
        <h5 class="mb-0 fw-bold text-success"><i class="bi bi-map me-2"></i>Rotas</h5>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-success btn-sm" onclick="abrirModalGps()">
                <i class="bi bi-globe me-1"></i>Criar com GPS
            </button>
            <button class="btn btn-success btn-sm" onclick="abrirModal()">
                <i class="bi bi-plus-lg me-1"></i>Nova Rota
            </button>
        </div>
    </div>

    <div class="card p-3" style="border-radius:12px; border:none; box-shadow:0 2px 8px rgba(0,0,0,0.08)">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-success">
                <tr>
                    <th>ID</th><th>Origem</th><th>Destino</th>
                    <th>Distância</th><th>Tempo Est.</th><th>Ações</th>
                </tr>
                </thead>
                <tbody id="tabela"></tbody>
            </table>
        </div>
        <div id="paginacao" class="d-flex justify-content-center gap-2 mt-2"></div>
    </div>
</div>

<!-- Modal Rota Manual -->
<div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="modalTitulo">Nova Rota</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="rotaId">
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label">Origem</label>
                        <input type="text" id="origem" class="form-control" placeholder="Ex: Porto Alegre">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Destino</label>
                        <input type="text" id="destino" class="form-control" placeholder="Ex: São Paulo">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Distância (km)</label>
                        <input type="number" id="distanciaKm" class="form-control">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Tempo estimado (min)</label>
                        <input type="number" id="tempoEstimado" class="form-control">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-success" onclick="salvar()">Salvar</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal GPS -->
<div class="modal fade" id="modalGps" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Criar Rota via GPS</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modalGps"
                        onclick="fecharModalGps()"></button>
            </div>
            <div class="modal-body">
                <div class="row g-2 mb-3">
                    <div class="col-5">
                        <label class="form-label">Origem</label>
                        <input type="text" id="gpsOrigem" class="form-control" placeholder="Ex: Porto Alegre">
                    </div>
                    <div class="col-5">
                        <label class="form-label">Destino</label>
                        <input type="text" id="gpsDestino" class="form-control" placeholder="Ex: São Paulo">
                    </div>
                    <div class="col-2 d-flex align-items-end">
                        <button class="btn btn-primary w-100" onclick="consultarGps()">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
                <div id="resultadoGps" class="d-none">
                    <div id="mapaRota"></div>
                    <div class="mt-2 p-3 bg-light rounded" id="infoGps"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="fecharModalGps()">Cancelar</button>
                <button class="btn btn-primary d-none" id="btnSalvarGps" onclick="salvarRotaGps()">
                    <i class="bi bi-save me-1"></i>Salvar Rota
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/api.js"></script>
<script>
    checkAuth();
    let paginaAtual = 0;
    let mapaGps = null;
    let dadosGps = null;
    const modal = new bootstrap.Modal(document.getElementById('modal'));
    const modalGpsEl = document.getElementById('modalGps');
    const modalGpsBS = new bootstrap.Modal(modalGpsEl);

    async function carregar(page = 0) {
        const data = await apiFetch(`/rotas?page=${page}&size=10&sort=id`);
        paginaAtual = page;
        document.getElementById('tabela').innerHTML = data.content.map(r => `
            <tr>
                <td>${r.id}</td>
                <td><i class="bi bi-geo-alt text-success"></i> ${r.origem}</td>
                <td><i class="bi bi-geo-alt-fill text-danger"></i> ${r.destino}</td>
                <td>${r.distanciaKm} km</td>
                <td>${r.tempoEstimado} min</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="editar(${r.id})">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deletar(${r.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');

        const pag = document.getElementById('paginacao');
        pag.innerHTML = '';
        for (let i = 0; i < data.totalPages; i++) {
            pag.innerHTML += `<button class="btn btn-sm ${i === page ? 'btn-success' : 'btn-outline-success'}"
                onclick="carregar(${i})">${i + 1}</button>`;
        }
    }

    function abrirModal() {
        document.getElementById('rotaId').value = '';
        document.getElementById('origem').value = '';
        document.getElementById('destino').value = '';
        document.getElementById('distanciaKm').value = '';
        document.getElementById('tempoEstimado').value = '';
        document.getElementById('modalTitulo').textContent = 'Nova Rota';
        modal.show();
    }

    function abrirModalGps() { modalGpsBS.show(); }
    function fecharModalGps() { modalGpsBS.hide(); }

    async function editar(id) {
        const r = await apiFetch('/rotas/' + id);
        document.getElementById('rotaId').value = r.id;
        document.getElementById('origem').value = r.origem;
        document.getElementById('destino').value = r.destino;
        document.getElementById('distanciaKm').value = r.distanciaKm;
        document.getElementById('tempoEstimado').value = r.tempoEstimado;
        document.getElementById('modalTitulo').textContent = 'Editar Rota';
        modal.show();
    }

    async function salvar() {
        const id = document.getElementById('rotaId').value;
        const body = {
            origem: document.getElementById('origem').value,
            destino: document.getElementById('destino').value,
            distanciaKm: parseFloat(document.getElementById('distanciaKm').value),
            tempoEstimado: parseInt(document.getElementById('tempoEstimado').value)
        };
        try {
            if (id) {
                await apiFetch('/rotas/' + id, { method: 'PUT', body: JSON.stringify(body) });
            } else {
                await apiFetch('/rotas', { method: 'POST', body: JSON.stringify(body) });
            }
            modal.hide();
            carregar(paginaAtual);
        } catch (e) { alert(e.message); }
    }

    async function consultarGps() {
    const origem = document.getElementById('gpsOrigem').value.trim();
    const destino = document.getElementById('gpsDestino').value.trim();
    if (!origem || !destino) {
        alert('Informe a origem e o destino');
        return;
    }

    const btnBuscar = document.querySelector('#modalGps .btn-primary');
    btnBuscar.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Buscando...';
    btnBuscar.disabled = true;

    try {
        dadosGps = await apiFetch(
            `/rotas/gps/consultar?origem=${encodeURIComponent(origem)}&destino=${encodeURIComponent(destino)}`
        );

        document.getElementById('resultadoGps').classList.remove('d-none');
        document.getElementById('btnSalvarGps').classList.remove('d-none');
        document.getElementById('infoGps').innerHTML = `
            <div class="row text-center">
                <div class="col-3">
                    <div class="text-muted small">Provedor GPS</div>
                    <strong class="text-primary">${dadosGps.provider}</strong>
                </div>
                <div class="col-3">
                    <div class="text-muted small">Distância</div>
                    <strong class="text-success fs-5">${dadosGps.distanciaKm} km</strong>
                </div>
                <div class="col-3">
                    <div class="text-muted small">Tempo estimado</div>
                    <strong class="text-warning fs-5">${dadosGps.tempoMinutos} min</strong>
                </div>
                <div class="col-3">
                    <div class="text-muted small">Rota</div>
                    <strong>${dadosGps.origem} → ${dadosGps.destino}</strong>
                </div>
            </div>
        `;

        // Busca coordenadas reais via Nominatim para o mapa
        const [coordOrigem, coordDestino] = await Promise.all([
            fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(origem)},Brasil&format=json&limit=1`,
                { headers: { 'User-Agent': 'GerenciamentoFrotas/1.0' }})
                .then(r => r.json()),
            fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(destino)},Brasil&format=json&limit=1`,
                { headers: { 'User-Agent': 'GerenciamentoFrotas/1.0' }})
                .then(r => r.json())
        ]);

        const latO = coordOrigem[0] ? parseFloat(coordOrigem[0].lat) : -15 + Math.random() * 10;
        const lonO = coordOrigem[0] ? parseFloat(coordOrigem[0].lon) : -50 + Math.random() * 10;
        const latD = coordDestino[0] ? parseFloat(coordDestino[0].lat) : -20 + Math.random() * 10;
        const lonD = coordDestino[0] ? parseFloat(coordDestino[0].lon) : -45 + Math.random() * 10;

        if (!mapaGps) {
            mapaGps = L.map('mapaRota').setView([(latO + latD) / 2, (lonO + lonD) / 2], 7);
            L.tileLayer(
                'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
                { attribution: '© CARTO | © OpenStreetMap' }
            ).addTo(mapaGps);
        } else {
            mapaGps.setView([(latO + latD) / 2, (lonO + lonD) / 2], 7);
        }

        mapaGps.eachLayer(l => {
            if (l instanceof L.Marker || l instanceof L.Polyline)
                mapaGps.removeLayer(l);
        });

        // Marcadores com ícones personalizados
        const iconOrigem = L.divIcon({
            html: '<div style="background:#2e7d32;color:white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px">A</div>',
            iconSize: [30, 30], iconAnchor: [15, 15]
        });
        const iconDestino = L.divIcon({
            html: '<div style="background:#c62828;color:white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px">B</div>',
            iconSize: [30, 30], iconAnchor: [15, 15]
        });

        L.marker([latO, lonO], { icon: iconOrigem })
            .addTo(mapaGps)
            .bindPopup(`<b>📍 Origem</b><br>${origem}`)
            .openPopup();

        L.marker([latD, lonD], { icon: iconDestino })
            .addTo(mapaGps)
            .bindPopup(`<b>🏁 Destino</b><br>${destino}`);

        // Linha conectando origem e destino
        L.polyline([[latO, lonO], [latD, lonD]], {
            color: '#1565c0', weight: 3, dashArray: '8, 8'
        }).addTo(mapaGps);

        // Ajusta zoom para mostrar os dois pontos
        mapaGps.fitBounds([[latO, lonO], [latD, lonD]], { padding: [40, 40] });

    } catch (e) {
        alert('Erro ao consultar GPS: ' + e.message);
    } finally {
        btnBuscar.innerHTML = '<i class="bi bi-search"></i>';
        btnBuscar.disabled = false;
    }
}

    async function salvarRotaGps() {
        const origem = document.getElementById('gpsOrigem').value;
        const destino = document.getElementById('gpsDestino').value;
        try {
            await apiFetch(
                `/rotas/gps?origem=${encodeURIComponent(origem)}&destino=${encodeURIComponent(destino)}`,
                { method: 'POST' }
            );
            fecharModalGps();
            carregar(paginaAtual);
            alert('Rota criada com GPS!');
        } catch (e) { alert(e.message); }
    }

    async function deletar(id) {
        if (!confirm('Excluir rota #' + id + '?')) return;
        try {
            await apiFetch('/rotas/' + id, { method: 'DELETE' });
            carregar(paginaAtual);
        } catch (e) { alert(e.message); }
    }

    carregar();
</script>
</body>
</html>
