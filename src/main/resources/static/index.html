<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Frotas — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1b5e20, #388e3c); min-height: 100vh;
               display: flex; align-items: center; justify-content: center; }
        .card { border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .logo { font-size: 3rem; color: #2e7d32; }
    </style>
</head>
<body>
<div class="container" style="max-width:420px">
    <div class="card p-4">
        <div class="text-center mb-4">
            <i class="bi bi-truck logo"></i>
            <h4 class="mt-2 fw-bold text-success">Sistema de Frotas</h4>
            <p class="text-muted small">Gerenciamento de Veículos e Rotas</p>
        </div>
        <div id="alerta" class="alert alert-danger d-none"></div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" id="email" class="form-control" placeholder="seu@email.com">
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Senha</label>
            <input type="password" id="senha" class="form-control" placeholder="••••••">
        </div>
        <button onclick="login()" class="btn btn-success w-100 fw-bold">
            <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
        </button>
        <hr>
        <p class="text-center text-muted small mb-0">
            Não tem conta?
            <a href="#" onclick="criarContaDemo()">Criar conta demo</a>
        </p>
    </div>
</div>

<script>
    if (localStorage.getItem('token')) window.location.href = '/dashboard.html';

    async function login() {
        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;
        const alerta = document.getElementById('alerta');
        alerta.classList.add('d-none');

        try {
            const res = await fetch('http://localhost:8080/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });
            if (!res.ok) throw new Error('Email ou senha inválidos');
            const data = await res.json();
            localStorage.setItem('token', data.token);
            localStorage.setItem('usuario', JSON.stringify({
                nome: data.nome, tipo: data.tipo, id: data.id
            }));
            window.location.href = '/dashboard.html';
        } catch (e) {
            alerta.textContent = e.message;
            alerta.classList.remove('d-none');
        }
    }

    async function criarContaDemo() {
        try {
            await fetch('http://localhost:8080/api/usuarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nome: 'Administrador',
                    email: 'admin@frotas.com',
                    senha: '123456',
                    tipo: 'ROLE_ADMIN'
                })
            });
            document.getElementById('email').value = 'admin@frotas.com';
            document.getElementById('senha').value = '123456';
            alert('Conta criada! Clique em Entrar.');
        } catch (e) {
            alert('Conta já existe. Use: admin@frotas.com / 123456');
        }
    }

    document.addEventListener('keypress', e => {
        if (e.key === 'Enter') login();
    });
</script>
</body>
</html>
